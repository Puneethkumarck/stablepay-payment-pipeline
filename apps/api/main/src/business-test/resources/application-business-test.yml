spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false

namastack:
  outbox:
    jdbc:
      schema-initialization:
        enabled: true

stablepay:
  auth:
    jwks-uri: http://localhost:0/.well-known/jwks.json
  ratelimit:
    redis-uri: ${REDIS_URI:redis://localhost:6379}
  opensearch:
    uri: http://localhost:19200
    transactions-index: transactions
  trino:
    url: jdbc:trino://localhost:18080/iceberg
    user: test

server:
  port: 0
