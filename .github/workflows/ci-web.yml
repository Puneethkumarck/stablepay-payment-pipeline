name: CI — Web

on:
  pull_request:
    paths: ['apps/web/**', 'apps/api/**', 'apps/auth/**', 'infra/docker-compose.yml']
  push:
    branches: [main]
    paths: ['apps/web/**', 'apps/api/**', 'apps/auth/**', 'infra/docker-compose.yml']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint + Typecheck + Vitest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate API client stubs (if missing)
        run: |
          if [ ! -f src/lib/api-client/_generated/client.gen.ts ]; then
            mkdir -p src/lib/api-client/_generated
            echo "export type CreateClientConfig = (config: Record<string, unknown>) => Record<string, unknown>;" > src/lib/api-client/_generated/client.gen.ts
            echo "export {};" > src/lib/api-client/_generated/sdk.gen.ts
            echo "export {};" > src/lib/api-client/_generated/index.ts
          fi

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Biome check
        run: pnpm exec biome check

      - name: ESLint
        run: pnpm exec eslint .

      - name: Vitest
        run: pnpm exec vitest run

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: lint-test
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - uses: pnpm/action-setup@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build backend JARs
        working-directory: .
        run: ./gradlew :apps:auth:main:bootJar :apps:api:main:bootJar

      - name: Start backend stack
        working-directory: .
        run: |
          docker compose -f infra/docker-compose.yml up -d postgres redis kafka schema-registry opensearch apps-auth apps-api
          timeout 180 bash -c 'until curl -sf http://localhost:8080/actuator/health; do sleep 5; done'

      - name: Run Playwright tests
        run: pnpm exec playwright test
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

      - name: Tear down stack
        if: always()
        working-directory: .
        run: docker compose -f infra/docker-compose.yml down -v
